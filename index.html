<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14152b"><title>猜猜我在演什麼</title><style>*{box-sizing:border-box}body{margin:0;background:#14152b;color:white;font-family:system-ui,sans-serif;text-align:center}main{max-width:650px;margin:auto;padding:24px}h1{color:#ffd65a;font-size:2.4rem;margin-bottom:4px}p{color:#bfc1df}button,select,textarea,input{font:inherit;border:0;border-radius:16px;padding:16px;color:white;background:#303251}button{cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.selected{background:#7954dc}.start{background:#ffd65a;color:#14152b;font-weight:bold;width:100%;margin-top:24px;font-size:1.3rem}select,textarea,input{width:100%;margin-top:12px}#play{min-height:100dvh;padding:16px;display:flex;flex-direction:column;gap:12px}#word{flex:1;display:grid;place-items:center;background:#6545c9;border-radius:24px;font-size:clamp(42px,12vw,100px);font-weight:900;padding:20px;overflow-wrap:anywhere}.bar{display:flex;justify-content:space-between;align-items:center}.yes{background:#16865c}.no{background:#bc4057}[hidden]{display:none!important}#result li{text-align:left;padding:8px}#score{font-size:64px;color:#ffd65a;font-weight:bold}@media(orientation:landscape){#play{height:100dvh}#word{font-size:clamp(36px,15vh,100px)}#play button{padding:10px}}#play{height:100vh;height:100dvh;min-height:0;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));gap:6px}#play .bar,#play .grid{flex:none}#play button{padding:9px 12px}#word{min-height:0;min-width:0;padding:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:14px;line-height:1.06}#wordText{display:block;max-width:100%;overflow-wrap:anywhere;word-break:normal;line-height:1.06;font-weight:900;text-align:center}.wordChoice{display:flex;align-items:center;gap:6px;background:#303251;border-radius:12px;padding:8px;margin:6px 0;text-align:left}.wordChoice label{display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow-wrap:anywhere}.wordChoice input{width:22px;height:22px;margin:0;flex:none;accent-color:#ffd65a}.wordChoice button{padding:8px;background:#484b70;font-size:14px}#customPanel{margin-top:12px}</style><main id="home"><h1>猜猜我在演什麼</h1><p>GUESS IT! · 比手畫腳</p><h3>選擇題庫</h3><div id="cats" class="grid"></div><div id="customPanel" hidden><h3>我的題庫</h3><select id="savedDeck" aria-label="選擇已儲存題庫"></select><input id="deckName" placeholder="題庫名稱，例如：朋友聚餐"><textarea id="custom" placeholder="每行輸入一個題目" rows="5"></textarea><div class="grid" style="margin-top:10px"><button id="saveDeck">儲存題庫</button><button id="newDeck">新增題庫</button><button id="deleteDeck" class="no">刪除題庫</button><button id="selectAll">全部勾選</button></div><p id="deckStatus" role="status"></p><div id="wordChoices"></div></div><h3>遊戲時間</h3><select id="duration" aria-label="遊戲時間" onchange="$('customTimeBox').hidden=this.value!=='custom'"><option value="30">30 秒</option><option value="60" selected>60 秒</option><option value="90">90 秒</option><option value="120">120 秒</option><option value="custom">自訂時間</option></select><div id="customTimeBox" hidden><label for="customTime">請輸入遊戲時間（秒）</label><input id="customTime" type="number" inputmode="numeric" min="1" max="86400" step="1" placeholder="例如：180" value="180"></div><button class="start" onclick="start()">開始遊戲 ▶</button><p>將手機橫放，讓朋友看見題目。</p></main><section id="play" hidden><div class="bar"><button onclick="finish()">結束</button><strong id="clock"></strong><span id="count"></span></div><div id="word"><span id="wordText"></span></div><div class="grid"><button class="no" onclick="next(false)">跳過 ✕</button><button class="yes" onclick="next(true)">答對 ✓</button></div></section><main id="result" hidden><h1>遊戲結束！</h1><div id="score"></div><p id="summary"></p><ol id="history"></ol><button class="start" onclick="start()">再玩一次</button><button style="margin-top:12px;width:100%" onclick="show('home')">返回首頁</button></main><script>const bank={'遊戲一':'企鵝 貓 狗 雞 大象 青蛙 螃蟹 兔子 猴子 刷牙 洗頭髮 穿鞋子 洗臉 睡覺 打電話 拍照 游泳 打棒球 踢足球 打籃球 牛 開車','動物':'大象 長頸鹿 企鵝 袋鼠 猴子 鱷魚 無尾熊 孔雀 河馬 老虎 獅子 蛇 兔子 烏龜 青蛙 貓咪 狗狗 螃蟹 章魚 鯊魚','日常動作':'刷牙 洗頭髮 開車 煮飯 打噴嚏 跳繩 掃地 釣魚 洗衣服 擦窗戶 吹頭髮 拍照 搭飛機 爬樓梯 騎摩托車 打電話 穿襪子 搬家 撐雨傘 剪指甲','職業':'警察 消防員 廚師 老師 醫生 空服員 攝影師 牙醫 司機 魔術師 歌手 舞者 農夫 郵差 理髮師 工程師 畫家 裁判 木工 漁夫','運動':'打籃球 游泳 打羽球 舉重 踢足球 打高爾夫球 打桌球 滑雪 衝浪 拳擊 跑步 射箭 保齡球 棒球 瑜珈 攀岩 跳水 擊劍','食物':'珍珠奶茶 臭豆腐 吃火鍋 漢堡 香蕉 冰淇淋 西瓜 拉麵 水餃 披薩 爆米花 薯條 蛋糕 烤肉 玉米 芒果 壽司 湯圓','搞笑題目':'踩到樂高 被蜜蜂追 踩到香蕉皮 假裝睡覺 機器人 殭屍 肚子痛 忍住打噴嚏 被蚊子叮 走路撞牆 吃到辣椒 忘記帶衛生紙 偷吃零食 假裝很忙 跳芭蕾舞'};const $=id=>document.getElementById(id);let cat='綜合題庫',deck=[],i=0,log=[],timer,end;function show(id){['home','play','result'].forEach(x=>$(x).hidden=x!==id)}function choose(c){cat=c;$('customPanel').hidden=c!=='自訂題庫';document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('selected',b.textContent===c))}for(const c of ['綜合題庫',...Object.keys(bank),'自訂題庫']){let b=document.createElement('button');b.textContent=c;b.onclick=()=>choose(c);$('cats').append(b)}choose(cat);function start(){let seconds=Number($('duration').value==='custom'?$('customTime').value:$('duration').value);if(!Number.isInteger(seconds)||seconds<1||seconds>86400){alert('請輸入 1 至 86400 秒的整數');$('customTime').focus();return}clearInterval(timer);let words=cat==='自訂題庫'?selectedCustomWords():cat==='綜合題庫'?Object.values(bank).join(' ').split(' '):bank[cat].split(' ');deck=[...new Set(words.map(x=>x.trim()).filter(Boolean))];if(!deck.length){alert('請先輸入題目');return}for(let j=deck.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[deck[j],deck[k]]=[deck[k],deck[j]]}i=0;log=[];end=Date.now()+seconds*1000;show('play');render();tick();timer=setInterval(tick,100)}function tick(){let s=Math.max(0,Math.ceil((end-Date.now())/1000));$('clock').textContent='剩餘 '+s+' 秒';if(!s)finish()}function fitWord(){if($('play').hidden)return;const box=$('word'),t=$('wordText');const w=box.clientWidth-10,h=box.clientHeight-10;if(w<=0||h<=0)return;let lo=1,hi=Math.ceil(Math.max(w,h));while(lo<hi){const mid=Math.ceil((lo+hi)/2);t.style.fontSize=mid+'px';if(t.scrollWidth<=w&&t.scrollHeight<=h)lo=mid;else hi=mid-1}t.style.fontSize=lo+'px'}function render(){$('wordText').textContent=deck[i];$('count').textContent=(i+1)+' / '+deck.length;fitWord();requestAnimationFrame(fitWord)}window.addEventListener('resize',fitWord);if(window.visualViewport)window.visualViewport.addEventListener('resize',fitWord);if(window.ResizeObserver)new ResizeObserver(fitWord).observe($('word'));if(document.fonts)document.fonts.ready.then(fitWord);function next(ok){if($('play').hidden)return;if(Date.now()>=end){finish();return}log.push([deck[i],ok]);if(++i===deck.length)finish();else render()}function finish(){clearInterval(timer);let n=log.filter(x=>x[1]).length;$('score').textContent=n+' 分';$('summary').textContent='答對 '+n+' 題 · 跳過 '+(log.length-n)+' 題';$('history').replaceChildren(...log.map(([w,ok])=>{let li=document.createElement('li');li.textContent=(ok?'✓ ':'✕ ')+w;return li}));show('result')}const storageKey='guess-it-personal-decks-v1';let savedDecks=[],activeDeck=null,excluded=new Set();try{const raw=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(raw))savedDecks=raw.filter(d=>d&&typeof d.id==='string'&&typeof d.name==='string'&&Array.isArray(d.words))}catch(e){}function customWords(){return [...new Set($('custom').value.split(/[\n,，]+/).map(w=>w.trim()).filter(Boolean))]}function selectedCustomWords(){return customWords().filter(w=>!excluded.has(w))}function status(s){$('deckStatus').textContent=s}function persist(){try{localStorage.setItem(storageKey,JSON.stringify(savedDecks));return true}catch(e){status('瀏覽器無法儲存，題庫僅保留於本次開啟。');return false}}function drawChoices(){const root=$('wordChoices');root.replaceChildren();for(const w of customWords()){const row=document.createElement('div');row.className='wordChoice';const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!excluded.has(w);cb.onchange=()=>{if(cb.checked)excluded.delete(w);else excluded.add(w);syncSelection()};label.append(cb,document.createTextNode(w));const edit=document.createElement('button');edit.textContent='修改';edit.onclick=()=>{const v=prompt('修改題目',w);if(v===null||!v.trim()||/[\n,，]/.test(v))return;const n=v.trim();$('custom').value=customWords().map(x=>x===w?n:x).join('\n');if(excluded.delete(w))excluded.add(n);drawChoices();status('已修改，請按儲存題庫。')};const del=document.createElement('button');del.textContent='刪除';del.onclick=()=>{$('custom').value=customWords().filter(x=>x!==w).join('\n');excluded.delete(w);drawChoices();status('已刪除，請按儲存題庫。')};row.append(label,edit,del);root.append(row)}}function syncSelection(){const d=savedDecks.find(x=>x.id===activeDeck);if(d){d.excluded=d.words.filter(w=>excluded.has(w));persist()}}function refreshDecks(){const s=$('savedDeck');s.replaceChildren(new Option('選擇已儲存題庫／新增題庫',''));for(const d of savedDecks)s.add(new Option(d.name,d.id));s.value=activeDeck||''}function loadDeck(id){const d=savedDecks.find(x=>x.id===id);activeDeck=d?d.id:null;$('deckName').value=d?d.name:'';$('custom').value=d?d.words.join('\n'):'';excluded=new Set(d&&Array.isArray(d.excluded)?d.excluded:[]);refreshDecks();drawChoices();status(d?'已載入題庫，可勾選本次要玩的題目。':'請輸入題庫名稱及題目。')} $('savedDeck').onchange=()=>loadDeck($('savedDeck').value);$('newDeck').onclick=()=>loadDeck('');$('custom').addEventListener('input',drawChoices);$('selectAll').onclick=()=>{excluded.clear();drawChoices();syncSelection()};$('saveDeck').onclick=()=>{const name=$('deckName').value.trim(),words=customWords();if(!name||!words.length){status('請輸入題庫名稱及至少一個題目。');return}const id=activeDeck||Date.now().toString(36)+Math.random().toString(36).slice(2);const d={id,name,words,excluded:words.filter(w=>excluded.has(w))};savedDecks=savedDecks.filter(x=>x.id!==id);savedDecks.push(d);activeDeck=id;refreshDecks();drawChoices();if(persist())status('已儲存「'+name+'」，共 '+words.length+' 題。')};$('deleteDeck').onclick=()=>{if(!activeDeck)return;if(!confirm('確定刪除這個題庫？'))return;savedDecks=savedDecks.filter(x=>x.id!==activeDeck);loadDeck('');if(persist())status('題庫已刪除。')};loadDeck(savedDecks[0]?.id||'');</script></html>
